<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b7a3b">
  <title>Connexion nécessaire · LIR</title>
  <style>
    :root{color-scheme:light dark;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f3f6f4;color:#14201a}
    body{min-height:100vh;display:grid;place-items:center;margin:0;padding:20px;box-sizing:border-box}
    main{max-width:430px;background:#fff;border:1px solid #e3e9e5;border-radius:20px;padding:26px;box-shadow:0 12px 32px #0b7a3b12}
    h1{font-size:1.4rem;margin:0 0 10px;color:#0b7a3b}p{line-height:1.55;margin:0;color:#52635a}
    button{margin-top:20px;border:0;border-radius:999px;background:#0b7a3b;color:#fff;padding:11px 18px;font:inherit;font-weight:700}
    @media(prefers-color-scheme:dark){:root{background:#0a110d;color:#e8f0ea}main{background:#141f19;border-color:#22312a}p{color:#aab9b0}}
  </style>
</head>
<body><main><h1>Connexion au serveur nécessaire</h1><p>LIR doit joindre son serveur pour afficher les livraisons et enregistrer les changements. Rétablis la connexion, puis recharge cette page.</p><button type="button" onclick="location.reload()">Réessayer</button></main></body>
</html>
